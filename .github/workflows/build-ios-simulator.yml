name: Build NEXUS iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    defaults:
      run:
        working-directory: NEXUS_MOBILE_APP

    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev typescript

      - name: Create iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync NEXUS
        run: npx cap sync ios

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package NEXUS
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/App.app \
            NEXUS-iOS-Simulator.zip

      - name: Upload NEXUS build
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-iOS-Simulator
          path: NEXUS_MOBILE_APP/NEXUS-iOS-Simulator.zip
